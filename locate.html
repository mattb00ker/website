<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Matt-Nav</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
  <!-- PapaParse for CSV parsing -->
  <script src="https://unpkg.com/papaparse@5.3.2/papaparse.min.js"></script>

  <style>
    /* Desktop: map 75% left, directions 25% right */
    @media (min-width: 768px) {
      #map {
        display: none;
        position: absolute;
        top: 0; bottom: 0; left: 0; right: 25%;
      }
      #instructions {
        display: none;
        position: absolute;
        top: 0; bottom: 0; right: 0;
        width: 25%;
      }
    }
    /* Mobile: map top 2/3, directions bottom 1/3 */
    @media (max-width: 767px) {
      #map {
        display: none;
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 33%;
      }
      #instructions {
        display: none;
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 33%; width: 100%;
      }
    }
    /* Common styles */
    #map, #instructions {
      background: #fafafa;
      overflow: auto;
      padding: 8px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
    }
    .controls {
      position: absolute;
      display: none;
      top: 10px; left: 10px;
      background: white;
      padding: 8px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.3);
      font-family: sans-serif;
      z-index: 1002;
    }
    #upload-panel {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.3);
      text-align: center;
      font-family: sans-serif;
      z-index: 1003;
    }
    #ui-toggles {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1004;
      display: none;
      background: white;
      padding: 6px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.3);
      font-family: sans-serif;
    }
    #ui-toggles button {
      margin: 2px 0;
      width: 120px;
    }
  </style>
</head>
<body>
  <div id="upload-panel">
    <h3>Load locations CSV</h3>
    <input type="file" id="file-input" accept=".csv" />
  </div>

  <div id="map"></div>
  <div id="instructions"></div>
  <div id="ui-toggles">
    <button id="toggle-controls">Hide controls</button><br>
    <button id="toggle-directions">Hide directions</button>
  </div>
  <div class="controls">
    <label for="destination-select">Destination:</label>
    <select id="destination-select"></select><br>
    <label for="mode">Mode:</label>
    <select id="mode">
      <option value="foot">Walking</option>
      <option value="car">Driving</option>
      <option value="bike">Cycling</option>
    </select><br>
    <div id="time-estimate" style="margin-top:8px;">ETA: --</div>
    <div id="distance-info"></div>
    <br>
    <label for="category-select">Category:</label>
    <select id="category-select"></select><br>
    <button id="nearest-btn">Nearest</button><br>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

  <script>
    let map, routingControl, lastPosition, csvUrl = null;
    let locations = [];
    let markers = [];
    let controlsVisible = true;
    let directionsVisible = true;
    let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
let categoryField = '';
let categoryOptions = [];
// Color/icon setup
const _markerColors = ['red','blue','green','orange','yellow','violet','grey','black'];
const categoryColors = {};
const categoryIcons = {};
let defaultIcon;
function initCategoryIcons() {
  // Assign each category (except 'all') a unique color
  categoryOptions.filter(c => c !== 'all').forEach((cat, idx) => {
    categoryColors[cat] = _markerColors[idx % _markerColors.length];
  });
  // Create icons
  Object.entries(categoryColors).forEach(([cat, color]) => {
    categoryIcons[cat] = new L.Icon({
      iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
      shadowUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-shadow.png',
      iconSize: [25, 41], iconAnchor: [12, 41],
      popupAnchor: [1, -34], shadowSize: [41, 41]
    });
  });
  // Fallback icon
  defaultIcon = new L.Icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-grey.png',
    shadowUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-shadow.png',
    iconSize: [25, 41], iconAnchor: [12, 41],
    popupAnchor: [1, -34], shadowSize: [41, 41]
  });
}

    document.getElementById('file-input').addEventListener('change', e => {
      const file = e.target.files[0]; if (!file) return;
      Papa.parse(file, {
        header: true, skipEmptyLines: true,
        complete: results => {
          locations = results.data.map(r => ({
            name: r.name,
            coords: [parseFloat(r.lat), parseFloat(r.lng)],
            website: r.website,
            // parse other boolean fields as booleans
            ...Object.fromEntries(Object.entries(r).map(([k,v]) => {
              if (['name','lat','lng','website'].includes(k)) return [];
              return [k, v.toLowerCase() === 'y'];
            }))
          }));
          // Determine which fields are boolean flags (y/n)
          categoryOptions = Object.keys(locations[0]).filter(
            key => ['name','coords','website'].indexOf(key) === -1 && typeof locations[0][key] === 'boolean'
          );
          // Add synthetic categories
          categoryOptions.unshift('favourites');
          categoryOptions.unshift('all');
          // Default to showing all locations
          categoryField = 'all';
          initCategoryIcons();
          populateCategorySelect();

          document.getElementById('upload-panel').style.display = 'none';
          document.getElementById('map').style.display = 'block';
          document.querySelector('.controls').style.display = 'block';
          document.getElementById('instructions').style.display = 'block';
          document.getElementById('ui-toggles').style.display = 'block';
          csvUrl = URL.createObjectURL(file);
          initApp();
        }
      });
    });

    function initApp() {
      map = L.map('map').setView([0,0],2);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OSM contributors'
      }).addTo(map);

      locations.forEach((loc, i) => {
        // Choose icon based on first matching category
        let icon = defaultIcon;
        for (const cat of categoryOptions) {
          if (cat === 'all') continue;
          if (loc[cat] && categoryIcons[cat]) {
            icon = categoryIcons[cat];
            break;
          }
        }
        const marker = L.marker(loc.coords, { icon: icon, zIndexOffset: 1000 })
          .addTo(map)
          .bindPopup(
            `<strong>${loc.name}</strong><br>` +
            `<a href="${loc.website}" target="_blank">` +
              `<img src="https://image.thum.io/get/width/300/${loc.website}" ` +
                   `alt="Thumbnail of ${loc.name}" ` +
                   `style="width:100%;height:auto;margin:8px 0;">` +
            `</a><br>` +
            `<a href="${loc.website}" target="_blank">Website</a><br>` +
            `<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${loc.coords[0]},${loc.coords[1]}" target="_blank">Street View</a><br>` +
            `<button class="fav-btn" data-index="${i}">` +
              `${favorites.includes(i) ? 'Remove from Favorites' : 'Add to Favorites'}` +
            `</button>`
          )
          .on('click', function() { this.openPopup(); });
        markers[i] = marker;
      });

      updateDestinationDropdown();
      updateDistanceInfo();
      updateMarkers();

      document.getElementById('mode').addEventListener('change', () => {
        if (lastPosition) {
          findRoute({ coords: { latitude: lastPosition[0], longitude: lastPosition[1] } });
        }
      });
      document.getElementById('destination-select').addEventListener('change', () => {
        if (lastPosition) {
          findRoute({ coords: { latitude: lastPosition[0], longitude: lastPosition[1] } });
          // Open the marker popup and pan to it
          const destIndex = document.getElementById('destination-select').value;
          const destCoords = locations[destIndex].coords;
          map.panTo(destCoords);
          markers[destIndex].openPopup();
          markers[destIndex].bringToFront();
          updateDistanceInfo();
        }
      });

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(p => {
          const np = [p.coords.latitude, p.coords.longitude];
          if (!lastPosition || haversineDistance(lastPosition, np) > 10) {
            lastPosition = np;
            findRoute(p);
            // When first route is drawn, open the selected marker popup
            const initialIndex = document.getElementById('destination-select').value;
            const initialCoords = locations[initialIndex].coords;
            map.panTo(initialCoords);
            markers[initialIndex].openPopup();
            markers[initialIndex].bringToFront();
            updateDestinationDropdown();
            updateDistanceInfo();
          }
        }, err => alert(err.message), {
          enableHighAccuracy: true, maximumAge: 0, timeout: 10000
        });
      } else {
        alert('Geolocation not supported.');
      }
    }

// If we're within this radius (in meters) of a location, treat it as "already here"
const VISITED_RADIUS_METERS = 50;
function haversineDistance([a1,a2], [b1,b2]) {
  const R = 6371e3, t = d => d * Math.PI / 180;
  const φ1 = t(a1), φ2 = t(b1), Δφ = t(b1 - a1), Δλ = t(b2 - a2);
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

    function findRoute(position) {
      const userCoords = [position.coords.latitude, position.coords.longitude];
      const di = document.getElementById('destination-select').value;
      const destCoords = locations[di].coords;
      if (routingControl) map.removeControl(routingControl);
      routingControl = L.Routing.control({
        waypoints: [L.latLng(...userCoords), L.latLng(...destCoords)],
        router: L.Routing.osrmv1({
          serviceUrl: 'https://router.project-osrm.org/route/v1',
          profile: document.getElementById('mode').value
        }),
        fitSelectedRoutes: true, addWaypoints: false, show: false
      }).addTo(map);

      routingControl.on('routesfound', e => {
        // Determine time based on mode
        const summary = e.routes[0].summary;
        const mode = document.getElementById('mode').value;
        let totalSec;
        if (mode === 'foot') {
          // Walking: average ~5 km/h => 1.3889 m/s
          totalSec = summary.totalDistance / 1.3889;
        } else if (mode === 'bike') {
          // Cycling: average ~15 km/h => 4.1667 m/s
          totalSec = summary.totalDistance / 4.1667;
        } else {
          // Driving: use OSRM time
          totalSec = summary.totalTime;
        }
        const hours = Math.floor(totalSec / 3600);
        const minutes = Math.floor((totalSec % 3600) / 60);
        const seconds = Math.floor(totalSec % 60);
        let eta = '';
        if (hours > 0) eta += hours + 'h ';
        if (minutes > 0) eta += minutes + 'm ';
        eta += seconds + 's';
        document.getElementById('time-estimate').textContent = 'ETA: ' + eta;
        const ins = document.getElementById('instructions');
        ins.innerHTML = '<h4>Directions</h4>';
        const ol = document.createElement('ol');
        e.routes[0].instructions.forEach(i => {
          const li = document.createElement('li');
          li.textContent = i.text;
          ol.appendChild(li);
        });
        ins.appendChild(ol);
        // Update the displayed distance whenever a route is found
        updateDistanceInfo();
      });
    }

    function populateCategorySelect() {
      const sel = document.getElementById('category-select');
      sel.innerHTML = '';
      // Add 'All' at top
      const allOpt = document.createElement('option');
      allOpt.value = 'all';
      allOpt.text = 'All';
      sel.appendChild(allOpt);
      // Then each category
      categoryOptions.filter(c => c !== 'all').forEach(opt => {
        const o = document.createElement('option');
        o.value = opt; o.text = opt.charAt(0).toUpperCase() + opt.slice(1);
        sel.appendChild(o);
      });
      sel.value = categoryField;
      sel.onchange = () => {
        categoryField = sel.value;
        let label;
        if (categoryField === 'all') {
          label = 'Location';
        } else if (categoryField === 'favourites') {
          label = 'Favourite';
        } else {
          label = categoryField.charAt(0).toUpperCase() + categoryField.slice(1);
        }
        document.getElementById('nearest-btn').textContent = 'Nearest ' + label;
        updateDestinationDropdown();
        updateDistanceInfo();
        updateMarkers();
      };
      // Initial label
      {
        let label;
        if (categoryField === 'all') {
          label = 'Location';
        } else if (categoryField === 'favourites') {
          label = 'Favourite';
        } else {
          label = categoryField.charAt(0).toUpperCase() + categoryField.slice(1);
        }
        document.getElementById('nearest-btn').textContent = 'Nearest ' + label;
      }
    }

    function updateDestinationDropdown() {
      const destSelect = document.getElementById('destination-select');
      destSelect.innerHTML = '';
      // Compute and collect items to show
      const items = locations
        .map((loc, i) => {
          // Filter by category
          if (categoryField === 'all') {
            // show everything
          } else if (categoryField === 'favourites') {
            if (!favorites.includes(i)) return null;
          } else if (!loc[categoryField]) {
            return null;
          }
          // Compute distance in km if we have lastPosition
          let distText = lastPosition
            ? (haversineDistance(lastPosition, loc.coords) / 1000).toFixed(2) + ' km'
            : '';
          const isFav = favorites.includes(i);
          return { index: i, name: loc.name, distText, isFav };
        })
        .filter(x => x);
      // Sort favorites first
      items.sort((a, b) => {
        if (a.isFav && !b.isFav) return -1;
        if (!a.isFav && b.isFav) return 1;
        return a.name.localeCompare(b.name);
      });
      // Populate
      items.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.index;
        opt.text = item.name + (item.isFav ? ' ★' : '');
        destSelect.appendChild(opt);
      });
      // Update distance display for currently selected destination
      updateDistanceInfo();
    }

    function updateDistanceInfo() {
      const sel = document.getElementById('destination-select');
      const i = parseInt(sel.value);
      const distanceDiv = document.getElementById('distance-info');
      if (lastPosition && !isNaN(i)) {
        const distText = (haversineDistance(lastPosition, locations[i].coords) / 1000).toFixed(2) + ' km';
        distanceDiv.textContent = 'Distance: ' + distText;
      }
      // else {
      //   distanceDiv.textContent = '';
      // }
    }

    // Show or hide markers based on the chosen category
    function updateMarkers() {
      locations.forEach((loc, i) => {
        let visible;
        if (categoryField === 'all') {
          visible = true;
        } else if (categoryField === 'favourites') {
          visible = favorites.includes(i);
        } else {
          visible = !!loc[categoryField];
        }
        if (visible) {
          if (!map.hasLayer(markers[i])) map.addLayer(markers[i]);
        } else {
          if (map.hasLayer(markers[i])) map.removeLayer(markers[i]);
        }
      });
    }

    document.body.addEventListener('click', e => {
      if (e.target.classList.contains('fav-btn')) {
        const i = parseInt(e.target.getAttribute('data-index'));
        const idx = favorites.indexOf(i);
        if (idx > -1) favorites.splice(idx,1);
        else if (favorites.length < 10) favorites.push(i);
        else return alert('Maximum of 10 favorites reached.');
        localStorage.setItem('favorites', JSON.stringify(favorites));
        updateDestinationDropdown();
        e.target.textContent = favorites.includes(i)
          ? 'Remove from Favorites'
          : 'Add to Favorites';
      }
    });

document.getElementById('nearest-btn')
  .addEventListener('click', () => {
    if (!lastPosition) return alert('Current position not available yet.');
    let nearestOutsideRadius = null, minOutside = Infinity;
    let nearestAny = null, minAny = Infinity;

    locations.forEach((loc, idx) => {
      let include = false;
      if (categoryField === 'all') {
        include = true;
      } else if (categoryField === 'favourites') {
        include = favorites.includes(idx);
      } else if (loc[categoryField]) {
        include = true;
      }
      if (include) {
        const d = haversineDistance(lastPosition, loc.coords);
        // Track absolute nearest (for fallback)
        if (d < minAny) {
          minAny = d;
          nearestAny = idx;
        }
        // Track nearest that isn't effectively "where we already are"
        if (d > VISITED_RADIUS_METERS && d < minOutside) {
          minOutside = d;
          nearestOutsideRadius = idx;
        }
      }
    });

    // Prefer the nearest location that is not essentially the one we're standing at.
    const chosenIndex = (nearestOutsideRadius !== null) ? nearestOutsideRadius : nearestAny;
    if (chosenIndex === null) return alert('No locations found for selected category.');

    // Select this location in the dropdown
    const destSelect = document.getElementById('destination-select');
    destSelect.value = chosenIndex;
    destSelect.dispatchEvent(new Event('change'));
  });

    // Toggle visibility of controls panel
    document.getElementById('toggle-controls').addEventListener('click', () => {
      controlsVisible = !controlsVisible;
      const controlsDiv = document.querySelector('.controls');
      controlsDiv.style.display = controlsVisible ? 'block' : 'none';
      document.getElementById('toggle-controls').textContent = controlsVisible ? 'Hide controls' : 'Show controls';
      if (map) {
        // Give the layout a moment to settle, then recalculate map size
        setTimeout(() => map.invalidateSize(), 200);
      }
    });

    // Toggle visibility of directions panel
    document.getElementById('toggle-directions').addEventListener('click', () => {
      directionsVisible = !directionsVisible;
      const directionsDiv = document.getElementById('instructions');
      const mapDiv = document.getElementById('map');

      if (directionsVisible) {
        // Show directions panel
        directionsDiv.style.display = 'block';
        document.getElementById('toggle-directions').textContent = 'Hide directions';
        // Restore split layout depending on viewport size
        if (window.innerWidth >= 768) {
          // Desktop: map 75% left, directions 25% right
          mapDiv.style.right = '25%';
          mapDiv.style.bottom = '0';
        } else {
          // Mobile: map top 2/3, directions bottom 1/3
          mapDiv.style.bottom = '33%';
          mapDiv.style.right = '0';
        }
      } else {
        // Hide directions panel
        directionsDiv.style.display = 'none';
        document.getElementById('toggle-directions').textContent = 'Show directions';
        // Expand map to fill available space
        mapDiv.style.right = '0';
        mapDiv.style.bottom = '0';
      }

      if (map) {
        // Give the layout a moment to settle, then recalculate map size
        setTimeout(() => map.invalidateSize(), 200);
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
