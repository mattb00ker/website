<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Sat Nav</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />
  <!-- PapaParse for CSV parsing -->
  <script src="https://unpkg.com/papaparse@5.3.2/papaparse.min.js"></script>

  <style>
    /* Desktop: map 75% left, directions 25% right */
    @media (min-width: 768px) {
      #map {
        display: none;
        position: absolute;
        top: 0; bottom: 0; left: 0; right: 25%;
      }
      #instructions {
        display: none;
        position: absolute;
        top: 0; bottom: 0; right: 0;
        width: 25%;
      }
    }
    /* Mobile: map top 2/3, directions bottom 1/3 */
    @media (max-width: 767px) {
      #map {
        display: none;
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 33%;
      }
      #instructions {
        display: none;
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 33%; width: 100%;
      }
    }
    /* Common styles */
    #map, #instructions {
      background: #fafafa;
      overflow: auto;
      padding: 8px;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
    }
    .controls {
      position: absolute;
      display: none;
      top: 10px; left: 10px;
      background: white;
      padding: 8px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.3);
      font-family: sans-serif;
      z-index: 1002;
    }
    #upload-panel {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.3);
      text-align: center;
      font-family: sans-serif;
      z-index: 1003;
    }
  </style>
</head>
<body>
  <div id="upload-panel">
    <h3>Load locations CSV</h3>
    <input type="file" id="file-input" accept=".csv" />
  </div>

  <div id="map"></div>
  <div id="instructions"></div>
  <div class="controls">
    <label for="destination-select">Destination:</label>
    <select id="destination-select"></select><br>
    <label for="mode">Mode:</label>
    <select id="mode">
      <option value="foot">Walking</option>
      <option value="car">Driving</option>
      <option value="bike">Cycling</option>
    </select><br>
    <div id="time-estimate" style="margin-top:8px;">ETA: --</div>
    <br>
    <button id="nearest-coffee">Nearest Cafe</button><br>
    <label for="favorite-select">Favorites:</label>
    <select id="favorite-select"><option value="">Select favorite</option></select><br>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

  <script>
    let map, routingControl, lastPosition, csvUrl = null;
    let locations = [];
    let markers = [];
    let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

    document.getElementById('file-input').addEventListener('change', e => {
      const file = e.target.files[0]; if (!file) return;
      Papa.parse(file, {
        header: true, skipEmptyLines: true,
        complete: results => {
          locations = results.data.map(r => ({
            name: r.name,
            coords: [parseFloat(r.lat), parseFloat(r.lng)],
            website: r.website,
            coffeeshop: r.coffeeshop && r.coffeeshop.toLowerCase() === 'y'
          }));
          document.getElementById('upload-panel').style.display = 'none';
          document.getElementById('map').style.display = 'block';
          document.querySelector('.controls').style.display = 'block';
          document.getElementById('instructions').style.display = 'block';
          csvUrl = URL.createObjectURL(file);
          initApp();
        }
      });
    });

    function initApp() {
      map = L.map('map').setView([0,0],2);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OSM contributors'
      }).addTo(map);

      locations.forEach((loc, i) => {
        const marker = L.marker(loc.coords, { zIndexOffset: 1000 })
          .addTo(map)
          .bindPopup(
            `<strong>${loc.name}</strong><br>` +
            `<a href="${loc.website}" target="_blank">` +
              `<img src="https://image.thum.io/get/width/300/${loc.website}" ` +
                   `alt="Thumbnail of ${loc.name}" ` +
                   `style="width:100%;height:auto;margin:8px 0;">` +
            `</a><br>` +
            `<a href="${loc.website}" target="_blank">Website</a><br>` +
            `<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${loc.coords[0]},${loc.coords[1]}" target="_blank">Street View</a><br>` +
            `<button class="fav-btn" data-index="${i}">` +
              `${favorites.includes(i) ? 'Remove from Favorites' : 'Add to Favorites'}` +
            `</button>`
          )
          .on('click', function() { this.openPopup(); });
        markers[i] = marker;
      });

      const destSelect = document.getElementById('destination-select');
      locations.forEach((loc,i) => {
        let o = document.createElement('option');
        o.value = i; o.text = loc.name;
        destSelect.appendChild(o);
      });

      document.getElementById('mode').addEventListener('change', () => {
        if (lastPosition) {
          findRoute({ coords: { latitude: lastPosition[0], longitude: lastPosition[1] } });
        }
      });
      destSelect.addEventListener('change', () => {
        if (lastPosition) {
          findRoute({ coords: { latitude: lastPosition[0], longitude: lastPosition[1] } });
          // Open the marker popup and pan to it
          const destIndex = destSelect.value;
          const destCoords = locations[destIndex].coords;
          map.panTo(destCoords);
          markers[destIndex].openPopup();
          markers[destIndex].bringToFront();
        }
      });

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(p => {
          const np = [p.coords.latitude, p.coords.longitude];
          if (!lastPosition || haversineDistance(lastPosition, np) > 10) {
            lastPosition = np;
            findRoute(p);
            // When first route is drawn, open the selected marker popup
            const initialIndex = document.getElementById('destination-select').value;
            const initialCoords = locations[initialIndex].coords;
            map.panTo(initialCoords);
            markers[initialIndex].openPopup();
            markers[initialIndex].bringToFront();
          }
        }, err => alert(err.message), {
          enableHighAccuracy: true, maximumAge: 0, timeout: 10000
        });
      } else {
        alert('Geolocation not supported.');
      }
      updateFavoritesDropdown();
    }

    function haversineDistance([a1,a2], [b1,b2]) {
      const R = 6371e3, t = d => d * Math.PI / 180;
      const φ1 = t(a1), φ2 = t(b1), Δφ = t(b1 - a1), Δλ = t(b2 - a2);
      const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function findRoute(position) {
      const userCoords = [position.coords.latitude, position.coords.longitude];
      const di = document.getElementById('destination-select').value;
      const destCoords = locations[di].coords;
      if (routingControl) map.removeControl(routingControl);
      routingControl = L.Routing.control({
        waypoints: [L.latLng(...userCoords), L.latLng(...destCoords)],
        router: L.Routing.osrmv1({
          serviceUrl: 'https://router.project-osrm.org/route/v1',
          profile: document.getElementById('mode').value
        }),
        fitSelectedRoutes: true, addWaypoints: false, show: false
      }).addTo(map);

      routingControl.on('routesfound', e => {
        // Determine time based on mode
        const summary = e.routes[0].summary;
        const mode = document.getElementById('mode').value;
        let totalSec;
        if (mode === 'foot') {
          // Walking: average ~5 km/h => 1.3889 m/s
          totalSec = summary.totalDistance / 1.3889;
        } else if (mode === 'bike') {
          // Cycling: average ~15 km/h => 4.1667 m/s
          totalSec = summary.totalDistance / 4.1667;
        } else {
          // Driving: use OSRM time
          totalSec = summary.totalTime;
        }
        const hours = Math.floor(totalSec / 3600);
        const minutes = Math.floor((totalSec % 3600) / 60);
        const seconds = Math.floor(totalSec % 60);
        let eta = '';
        if (hours > 0) eta += hours + 'h ';
        if (minutes > 0) eta += minutes + 'm ';
        eta += seconds + 's';
        document.getElementById('time-estimate').textContent = 'ETA: ' + eta;
        const ins = document.getElementById('instructions');
        ins.innerHTML = '<h4>Directions</h4>';
        const ol = document.createElement('ol');
        e.routes[0].instructions.forEach(i => {
          const li = document.createElement('li');
          li.textContent = i.text;
          ol.appendChild(li);
        });
        ins.appendChild(ol);
      });
    }

    function updateFavoritesDropdown() {
      const favSelect = document.getElementById('favorite-select');
      favSelect.innerHTML = '<option value="">Select favorite</option>';
      favorites.forEach(i => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.text = locations[i].name;
        favSelect.appendChild(opt);
      });
    }

    document.body.addEventListener('click', e => {
      if (e.target.classList.contains('fav-btn')) {
        const i = parseInt(e.target.getAttribute('data-index'));
        const idx = favorites.indexOf(i);
        if (idx > -1) favorites.splice(idx,1);
        else if (favorites.length < 10) favorites.push(i);
        else return alert('Maximum of 10 favorites reached.');
        localStorage.setItem('favorites', JSON.stringify(favorites));
        updateFavoritesDropdown();
        e.target.textContent = favorites.includes(i)
          ? 'Remove from Favorites'
          : 'Add to Favorites';
      }
    });

    document.getElementById('favorite-select')
      .addEventListener('change', function() {
        const i = parseInt(this.value);
        if (!isNaN(i)) {
          const coords = locations[i].coords;
          map.panTo(coords);
          markers[i].openPopup();
          markers[i].bringToFront();
          if (lastPosition) {
            findRoute({coords:{latitude:lastPosition[0], longitude:lastPosition[1]}});
          }
        }
      });

    document.getElementById('nearest-coffee')
      .addEventListener('click', () => {
        if (!lastPosition) return alert('Current position not available yet.');
        let nearest = null, minD = Infinity;
        locations.forEach((loc, idx) => {
          if (loc.coffeeshop) {
            const d = haversineDistance(lastPosition, loc.coords);
            if (d < minD) { minD = d; nearest = idx; }
          }
        });
        if (nearest === null) return alert('No coffee shops found.');
        const coords = locations[nearest].coords;
        map.panTo(coords);
        markers[nearest].openPopup();
        markers[nearest].bringToFront();
        findRoute({coords:{latitude:lastPosition[0],longitude:lastPosition[1]}});
      });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
