<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Sat Nav</title>
  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
  <!-- Leaflet Routing Machine CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"
  />
  <style>
    /* Make the map fill the viewport */
    #map { height: 100vh; margin: 0; padding: 0; }
    /* Container for transport-mode controls */
    .controls {
      position: absolute;
      top: 10px;
      left: 50px;
      z-index: 1000;
      background: white;
      padding: 8px 12px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <!-- Map goes here -->
  <div id="map"></div>

  <!-- Transport-mode selector -->
  <div class="controls">
    <label for="mode">Transport mode:</label>
    <select id="mode">
      <option value="car">Driving</option>
      <option value="foot">Walking</option>
      <option value="bike">Cycling</option>
    </select>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- Leaflet Routing Machine JS -->
  <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
  <script>
    // ==== 1. YOUR LOCATIONS ====
    // Replace these with your own names & [lat, lng].
    const locations = [
      { name: "Big Ben", coords: [51.5007, -0.1246] },
      { name: "Tower Bridge", coords: [51.5055, -0.0754] },
      // … up to ~100 entries
    ];

    // ==== 2. INITIALIZE MAP ====
    const map = L.map('map').setView([51.505, -0.09], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Add markers for all predefined locations
    locations.forEach(loc => {
      L.marker(loc.coords)
        .addTo(map)
        .bindPopup(loc.name);
    });

    let routingControl = null; // will hold our route

    // ==== 3. HAVERSINE DISTANCE ====
    function haversineDistance([lat1, lon1], [lat2, lon2]) {
      const toRad = deg => deg * Math.PI / 180;
      const R = 6371e3; // metres
      const φ1 = toRad(lat1), φ2 = toRad(lat2);
      const Δφ = toRad(lat2 - lat1), Δλ = toRad(lon2 - lon1);
      const a = Math.sin(Δφ/2)**2 +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // ==== 4. FIND & DISPLAY FASTEST ROUTE ====
    function findFastestRoute(position) {
      const userCoords = [position.coords.latitude, position.coords.longitude];

      // 4a) Compute straight-line distances
      const ranked = locations
        .map(loc => ({
          ...loc,
          distance: haversineDistance(userCoords, loc.coords)
        }))
        .sort((a, b) => a.distance - b.distance)
        .slice(0, 3); // take top 3 candidates

      // 4b) Remove old route if any
      if (routingControl) {
        map.removeControl(routingControl);
      }

      // 4c) Create new routing control targeting the closest by travel time
      routingControl = L.Routing.control({
        waypoints: [
          L.latLng(...userCoords),
          L.latLng(...ranked[0].coords)
        ],
        router: L.Routing.osrmv1({
          serviceUrl: 'https://router.project-osrm.org/route/v1',
          profile: document.getElementById('mode').value
        }),
        fitSelectedRoutes: true,
        addWaypoints: false,
        show: false
      }).addTo(map);
    }

    // ==== 5. GEOLOCATION SETUP ====
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(pos => {
        // place a marker for the user
        const u = [pos.coords.latitude, pos.coords.longitude];
        L.marker(u)
          .addTo(map)
          .bindPopup("You are here")
          .openPopup();

        map.setView(u, 13);
        findFastestRoute(pos);
      }, err => {
        alert("Unable to get location: " + err.message);
      });
    } else {
      alert("Your browser doesn’t support geolocation.");
    }

    // ==== 6. RECOMPUTE ON MODE CHANGE ====
    document.getElementById('mode')
      .addEventListener('change', () => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(findFastestRoute);
        }
      });
  </script>
</body>
</html>
